<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0f766e">
<title>مراقبة المشاركة</title>
<style>
  :root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--mut:#6b7280;--pri:#0f766e;--ok:#15803d;--bad:#b91c1c;--warn:#b45309;--line:#e5e7eb}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
  header{background:var(--pri);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
  header h1{font-size:17px;margin:0}
  header small{opacity:.9;display:block;font-size:12px}
  main{padding:14px;max-width:560px;margin:0 auto}
  .card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  label{display:block;margin-bottom:6px;font-weight:600}
  input{width:100%;padding:14px;font-size:20px;border:2px solid var(--line);border-radius:10px;margin-bottom:12px;direction:ltr;text-align:center}
  input.rtl{direction:rtl;text-align:right;font-size:16px}
  input:focus{outline:none;border-color:var(--pri)}
  button{width:100%;padding:15px;font-size:18px;font-weight:700;border:0;border-radius:10px;background:var(--pri);color:#fff;cursor:pointer}
  button:disabled{opacity:.5}
  button.sec{background:#e5e7eb;color:var(--ink);font-size:15px;padding:10px;width:auto}
  button.ok{background:var(--ok)}
  .msg{padding:14px;border-radius:10px;margin-top:12px;font-weight:600;line-height:1.7}
  .msg.ok{background:#dcfce7;color:var(--ok)} .msg.bad{background:#fee2e2;color:var(--bad)}
  .msg.warn{background:#fef3c7;color:var(--warn)} .msg.info{background:#e0f2fe;color:#075985}
  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tabs button{background:#fff;color:var(--ink);font-size:14px;padding:10px 4px;border:2px solid var(--line)}
  .tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
  .stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:17px}
  .stat:last-child{border:0} .big{font-size:40px;font-weight:800;text-align:center;color:var(--pri)}
  table{width:100%;border-collapse:collapse;font-size:14px} td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}
  .tag{padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700}
  .t-registered{background:#dcfce7;color:var(--ok)} .t-duplicate_attempt{background:#fee2e2;color:var(--bad)}
  .t-check{background:#e0f2fe;color:#075985} .t-denied{background:#fef3c7;color:var(--warn)}
  #net{display:none;background:var(--bad);color:#fff;text-align:center;padding:8px;font-weight:700}
  .hide{display:none!important}
  .note{color:var(--mut);font-size:13px;margin-top:8px}
</style>
</head>
<body>
<div id="net">لا يوجد اتصال بالإنترنت — التسجيل متوقف</div>
<header>
  <div><h1>مراقبة المشاركة</h1><small id="who"></small></div>
  <button class="sec hide" id="logout">خروج</button>
</header>
<main>

  <!-- تسجيل الدخول -->
  <section id="v-login" class="card">
    <label for="email">البريد الإلكتروني</label>
    <input id="email" type="email" autocomplete="username" class="rtl" style="direction:ltr;text-align:left">
    <label for="pass">كلمة المرور</label>
    <input id="pass" type="password" autocomplete="current-password" class="rtl" style="direction:ltr;text-align:left">
    <button id="btn-login">دخول</button>
    <div id="login-msg"></div>
  </section>

  <!-- التطبيق -->
  <div id="v-app" class="hide">
    <div class="tabs" id="tabs">
      <button data-t="verify" class="on">تحقق</button>
      <button data-t="stats">إحصائيات</button>
      <button data-t="logs" class="adm hide">السجل</button>
    </div>

    <section id="t-verify" class="card">
      <label for="cin">رقم البطاقة الوطنية (CIN)</label>
      <input id="cin" inputmode="text" autocapitalize="characters" autocomplete="off" maxlength="12" placeholder="AB123456">
      <button id="btn-check">تحقق</button>
      <div id="verify-out"></div>
      <p class="note">يتم التحقق من الهوية والأهلية بالطرق الرسمية قبل التسجيل. التطبيق لا يعوض اللوائح الرسمية.</p>
    </section>

    <section id="t-stats" class="hide">
      <div class="card"><div class="note" style="text-align:center">العدد الإجمالي للمشاركين</div><div class="big" id="s-total">–</div></div>
      <div class="card" id="s-offices"></div>
      <div class="card"><div class="stat"><span>محاولات التكرار</span><b id="s-dup">–</b></div>
      <div class="note" id="s-time"></div></div>
    </section>

    <section id="t-logs" class="card hide">
      <table><thead><tr><th>الوقت</th><th>العملية</th><th>المكتب</th></tr></thead><tbody id="log-body"></tbody></table>
      <button class="sec" id="btn-reload" style="margin-top:12px">تحديث</button>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ====== عوض هاد القيمتين بقيم مشروعك (Settings > API). anon key فقط، ماشي service_role ======
const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_L74J221LumiXJCdzOsCVAg_jFy4OiUa";
// ===========================================================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const ACTION_AR = {check:"تحقق", registered:"تسجيل", duplicate_attempt:"محاولة تكرار", denied:"رفض"};
let profile = null, offices = {}, pollTimer = null, busy = false;

function box(el, cls, text){
  el.textContent = ""; const d = document.createElement("div");
  d.className = "msg " + cls; d.textContent = text; el.appendChild(d); return d;
}
const fmt = iso => new Date(iso).toLocaleString("ar-MA-u-nu-latn", {dateStyle:"short", timeStyle:"medium"});
const online = () => navigator.onLine;
function netUI(){ $("net").style.display = online() ? "none" : "block"; $("btn-check").disabled = !online(); }
addEventListener("online", netUI); addEventListener("offline", netUI);

function errText(e){
  const m = (e && e.message) || "";
  if (m.includes("invalid_cin_format")) return "صيغة CIN غير صحيحة. مثال: AB123456";
  if (m.includes("not_authorized")) return "ليست لديك صلاحية لهذه العملية.";
  if (!online() || m.includes("Failed to fetch") || m.includes("NetworkError")) return "تعذر الاتصال بالقاعدة. لا يسمح بالتسجيل حتى يعود الاتصال.";
  return "حدث خطأ. أعد المحاولة.";
}

// ---------- الدخول ----------
$("btn-login").onclick = async () => {
  const out = $("login-msg"); out.textContent = "";
  if (!online()) return box(out, "bad", "لا يوجد اتصال بالإنترنت.");
  $("btn-login").disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pass").value });
  $("btn-login").disabled = false;
  if (error) return box(out, "bad", "بيانات الدخول غير صحيحة.");
  $("pass").value = ""; await boot();
};
$("logout").onclick = async () => { clearInterval(pollTimer); await sb.auth.signOut(); location.reload(); };

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;
  const { data, error } = await sb.from("users").select("full_name,role,office_id,active").eq("id", session.user.id).single();
  if (error || !data || !data.active){ await sb.auth.signOut(); return box($("login-msg"), "bad", "هذا الحساب غير مفعل."); }
  profile = data;
  const { data: offs } = await sb.from("offices").select("id,name");
  (offs || []).forEach(o => offices[o.id] = o.name);
  $("who").textContent = profile.full_name + " — " + (profile.role === "admin" ? "مسؤول" : offices[profile.office_id] || "");
  $("v-login").classList.add("hide"); $("v-app").classList.remove("hide"); $("logout").classList.remove("hide");
  if (profile.role === "admin"){ document.querySelectorAll(".adm").forEach(e => e.classList.remove("hide")); $("t-verify").classList.add("hide"); show("stats"); $("tabs").querySelector('[data-t="verify"]').classList.add("hide"); }
  else show("verify");
  netUI(); loadStats(); pollTimer = setInterval(loadStats, 5000);
}

// ---------- التبويبات ----------
function show(t){
  ["verify","stats","logs"].forEach(n => $("t-"+n).classList.toggle("hide", n !== t));
  $("tabs").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  if (t === "logs") loadLogs(); if (t === "stats") loadStats();
}
$("tabs").onclick = e => { const t = e.target.dataset && e.target.dataset.t; if (t) show(t); };

// ---------- التحقق والتسجيل ----------
$("cin").addEventListener("input", e => e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ""));
$("cin").addEventListener("keydown", e => { if (e.key === "Enter") $("btn-check").click(); });

$("btn-check").onclick = async () => {
  if (busy) return; const out = $("verify-out"); const cin = $("cin").value.trim();
  if (!cin) return box(out, "warn", "أدخل رقم CIN.");
  if (!online()) return box(out, "bad", "لا يوجد اتصال. لا يسمح بالتسجيل حتى يعود الاتصال.");
  busy = true; $("btn-check").disabled = true;
  try{
    const { data, error } = await sb.rpc("check_cin", { p_cin: cin });
    if (error) throw error;
    if (data.status === "already_registered"){
      box(out, "bad", "مسجل مسبقا في " + data.office + " بتاريخ " + fmt(data.recorded_at) + ". لا يسمح بتسجيل ثان.");
    } else {
      const m = box(out, "ok", "غير مسجل. بعد التحقق من الهوية والأهلية يمكنك تسجيل المشاركة.");
      const b = document.createElement("button"); b.className = "ok"; b.style.marginTop = "12px"; b.textContent = "تسجيل المشاركة";
      b.onclick = () => register(cin, b); m.appendChild(b);
    }
  }catch(e){ box(out, "bad", errText(e)); }
  finally{ busy = false; netUI(); }
};

async function register(cin, btn){
  if (busy) return; const out = $("verify-out");
  if (!online()) return box(out, "bad", "لا يوجد اتصال. لا يسمح بالتسجيل حتى يعود الاتصال.");
  busy = true; btn.disabled = true;
  try{
    const { data, error } = await sb.rpc("register_participation", { p_cin: cin });
    if (error) throw error;
    if (data.status === "registered"){ box(out, "ok", "تم تسجيل المشاركة ✓  " + fmt(data.recorded_at)); $("cin").value = ""; loadStats(); }
    else box(out, "bad", "تم تسجيل هذا الشخص للتو في " + data.office + " بتاريخ " + fmt(data.recorded_at) + ". لم يتم تسجيل جديد.");
  }catch(e){ box(out, "bad", errText(e)); }
  finally{ busy = false; netUI(); }
}

// ---------- الإحصائيات ----------
async function loadStats(){
  if (!profile || !online()) return;
  const { data, error } = await sb.rpc("get_stats"); if (error) return;
  $("s-total").textContent = data.total;
  const box_ = $("s-offices"); box_.textContent = "";
  data.by_office.forEach(o => {
    const r = document.createElement("div"); r.className = "stat";
    const a = document.createElement("span"); a.textContent = o.office;
    const b = document.createElement("b"); b.textContent = o.count; r.append(a, b); box_.appendChild(r);
  });
  $("s-dup").textContent = data.duplicate_attempts;
  $("s-time").textContent = "آخر تحديث: " + new Date().toLocaleTimeString("ar-MA-u-nu-latn");
}

// ---------- سجل العمليات (للمسؤول) ----------
async function loadLogs(){
  const body = $("log-body"); body.textContent = "";
  const { data, error } = await sb.from("audit_logs").select("action,office_id,created_at")
    .neq("action", "check").order("created_at", { ascending: false }).limit(100);
  if (error) return;
  data.forEach(l => {
    const tr = document.createElement("tr");
    const c1 = document.createElement("td"); c1.textContent = fmt(l.created_at);
    const c2 = document.createElement("td"); const s = document.createElement("span");
    s.className = "tag t-" + l.action; s.textContent = ACTION_AR[l.action] || l.action; c2.appendChild(s);
    const c3 = document.createElement("td"); c3.textContent = offices[l.office_id] || "";
    tr.append(c1, c2, c3); body.appendChild(tr);
  });
}
$("btn-reload").onclick = loadLogs;

boot();
</script>
</body>
</html>
